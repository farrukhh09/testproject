<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: постоянное тёмно-синее меню слева + липкая верхняя панель + рабочая область на холодном светло-сером; шаг 4px, радиусы 4/6/8/10 */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --surface-3:#ECF0F5;
  --line:#E1E6EE; --line-strong:#CBD3DF;
  --ink:#0E1A2C; --ink-2:#44536A; --ink-3:#77849A;
  --nav:#0A1930; --nav-2:#132A52; --nav-hover:#10213F; --nav-ink:#A9B7CD; --nav-ink-strong:#FFFFFF; --nav-line:#1A2E54;
  --accent:#1D5BBF; --accent-hover:#174C9F; --accent-soft:#E7EFFB; --accent-ink:#1A4FA6; --on-accent:#FFFFFF;
  --ok:#0F7A55; --ok-soft:#E2F2EB; --bad:#B8322B; --bad-soft:#FAE9E7; --warn:#935700; --warn-soft:#FCF1DC; --neutral-soft:#EDF0F5;
  --brand-tile:#1D5BBF; --brand-ink:#FFFFFF; --knob:#FFFFFF;
  --viz-1:#86B6EF; --viz-2:#3987E5; --viz-3:#184F95; --viz-grid:#E4E9F0;
  --shadow-1:0 1px 2px rgba(14,26,44,.06),0 1px 1px rgba(14,26,44,.03);
  --shadow-2:0 12px 32px rgba(14,26,44,.14),0 2px 8px rgba(14,26,44,.08);
  --scrim:rgba(8,18,36,.48);
  --font-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111C; --surface:#0F1826; --surface-2:#132033; --surface-3:#18273D;
    --line:#1F2E45; --line-strong:#2C3F5E;
    --ink:#E4EAF3; --ink-2:#A5B2C6; --ink-3:#73839B;
    --nav:#060D19; --nav-2:#12233F; --nav-hover:#0D1A30; --nav-ink:#97A6BD; --nav-ink-strong:#FFFFFF; --nav-line:#14223B;
    --accent:#5B8FE6; --accent-hover:#79A5EE; --accent-soft:#14284A; --accent-ink:#93B6F2; --on-accent:#06101F;
    --ok:#3DBA8C; --ok-soft:#0E2A21; --bad:#EE746C; --bad-soft:#341716; --warn:#E3A63F; --warn-soft:#2E2210; --neutral-soft:#1A2639;
    --brand-tile:#2D6AD0; --brand-ink:#FFFFFF; --knob:#FFFFFF;
    --viz-1:#1C5CAB; --viz-2:#3987E5; --viz-3:#9EC5F4; --viz-grid:#1E2C42;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
    --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111C; --surface:#0F1826; --surface-2:#132033; --surface-3:#18273D;
  --line:#1F2E45; --line-strong:#2C3F5E;
  --ink:#E4EAF3; --ink-2:#A5B2C6; --ink-3:#73839B;
  --nav:#060D19; --nav-2:#12233F; --nav-hover:#0D1A30; --nav-ink:#97A6BD; --nav-ink-strong:#FFFFFF; --nav-line:#14223B;
  --accent:#5B8FE6; --accent-hover:#79A5EE; --accent-soft:#14284A; --accent-ink:#93B6F2; --on-accent:#06101F;
  --ok:#3DBA8C; --ok-soft:#0E2A21; --bad:#EE746C; --bad-soft:#341716; --warn:#E3A63F; --warn-soft:#2E2210; --neutral-soft:#1A2639;
  --brand-tile:#2D6AD0; --brand-ink:#FFFFFF; --knob:#FFFFFF;
  --viz-1:#1C5CAB; --viz-2:#3987E5; --viz-3:#9EC5F4; --viz-grid:#1E2C42;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 16px 40px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em;color:var(--ink)}
p{margin:0}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.93em;letter-spacing:-.01em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.grow{flex:1 1 auto;min-width:0}
.right{margin-left:auto}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100%}
.side{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:20px 20px 18px;border-bottom:1px solid var(--nav-line)}
.brand-mark{width:34px;height:34px}
.brand-name{font-family:var(--font-display);font-weight:800;color:var(--nav-ink-strong);font-size:17px;line-height:1.1;letter-spacing:.01em}
.brand-sub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--nav-ink);margin-top:3px}
.nav{padding:8px 12px 16px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--nav-ink);opacity:.65;padding:16px 10px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-sm);color:var(--nav-ink);font-weight:500;font-size:13.5px;border:0;background:none;cursor:pointer;width:100%;text-align:left}
.nav-item svg{width:18px;height:18px}
.nav-item:hover{background:var(--nav-hover);color:var(--nav-ink-strong)}
.nav-item[aria-current="page"]{background:var(--nav-2);color:var(--nav-ink-strong)}
.nav-item[aria-current="page"] svg{color:var(--accent-ink)}
.nav-count{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand-tile);color:var(--brand-ink);font-size:11px;font-weight:600;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--nav-line);display:flex;flex-direction:column;gap:10px}
.env{padding:10px 12px;border-radius:var(--r-md);background:var(--nav-hover);font-size:12px;line-height:1.45}
.env b{color:var(--nav-ink-strong);font-weight:600;display:flex;align-items:center;gap:8px}
.env b svg{width:14px;height:14px}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:44}
.main{min-width:0;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:0 28px;min-height:64px;background:var(--surface);border-bottom:1px solid var(--line)}
.top-title{min-width:0}
.crumb{font-size:12px;color:var(--ink-3)}
.top h1{font-size:18px;font-weight:700;line-height:1.25}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-3);color:var(--ink-2)}
.pill svg{width:14px;height:14px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none}
.user{display:flex;align-items:center;gap:10px;padding-left:12px;border-left:1px solid var(--line)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.avatar.lg{width:44px;height:44px;font-size:15px}
.who b{display:block;font-size:13px;font-weight:600;line-height:1.2}
.who span{font-size:11.5px;color:var(--ink-3)}
.view{padding:24px 28px 56px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:1480px;margin:0 auto}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.intro p{color:var(--ink-2);max-width:72ch}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:700}
.card-h .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) minmax(0,380px)}
@media (max-width:1180px){.g-5{grid-template-columns:repeat(3,minmax(0,1fr))}.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main,.g-side{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.g-5,.g-3,.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g-5,.g-4,.g-3,.g-2{grid-template-columns:minmax(0,1fr)}}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi-l{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi-l svg{width:15px;height:15px;color:var(--ink-3)}
.kpi-v{font-family:var(--font-display);font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi-v small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.kpi-s{font-size:12px;color:var(--ink-3)}
.kpi.flat{box-shadow:none;background:var(--surface-2)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-danger{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.btn-danger:hover{background:var(--bad);opacity:.9}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-ghost.danger{color:var(--bad)}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px;gap:6px}
.btn-sm svg{width:14px;height:14px}
.btn-lg{height:42px;padding:0 18px;font-size:14px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent-ink);padding:0;cursor:pointer;font-weight:500;font-size:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line-strong)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.label{font-size:12px;font-weight:600;color:var(--ink-2)}
.label .req{color:var(--bad)}
.hint{font-size:12px;color:var(--ink-3)}
.input,.select,.textarea{height:36px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;font-size:13.5px;width:100%;min-width:0;color:var(--ink)}
.select{padding-right:28px;cursor:pointer}
.select.sm,.input.sm{height:30px;font-size:12.5px;width:auto}
.textarea{height:auto;padding:10px 12px;min-height:150px;resize:vertical;line-height:1.55}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input.err,.textarea.err{border-color:var(--bad)}
.err-text{font-size:12px;color:var(--bad)}
.input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.search{position:relative;flex:1 1 240px;max-width:340px;min-width:0}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.search .input{padding-left:34px}
input[type="checkbox"],input[type="radio"]{accent-color:var(--accent);width:16px;height:16px;margin:0;cursor:pointer}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{margin-top:2px;flex:none}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px}
.switch input{appearance:none;-webkit-appearance:none;width:36px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--knob);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}
.switch input:disabled{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;flex:none;max-width:100%;overflow-x:auto}
.seg button{border:0;background:var(--surface);padding:0 12px;height:30px;font-size:12.5px;cursor:pointer;color:var(--ink-2);border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.toolbar .select{width:auto;flex:0 1 auto;max-width:100%}
.bulk{display:flex;align-items:center;gap:10px;padding:8px 18px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bulk b{font-weight:600}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-xs);font-size:12px;font-weight:500;white-space:nowrap;background:var(--neutral-soft);color:var(--ink-2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-info{background:var(--accent-soft);color:var(--accent-ink)}
.b-muted{background:var(--neutral-soft);color:var(--ink-3)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--r-xs);border:1px solid var(--line);font-size:12px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}

/* ---------- tables ---------- */
.tw{overflow:auto;max-height:var(--tw-h,none)}
.dt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.dt th{position:sticky;top:0;z-index:1;background:var(--surface-2);text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr:hover td{background:var(--surface-2)}
.dt tr.clickable{cursor:pointer}
.dt tr.sel td{background:var(--accent-soft)}
.dt .r{text-align:right}
.dt td.wrap{white-space:normal;min-width:240px;max-width:420px}
.dt .chk{width:44px;padding-right:0}
.dt td.empty-cell{padding:0;white-space:normal}
.dt tbody tr.empty-row:hover td{background:none}
.th-sort{border:0;background:none;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.th-sort svg{width:12px;height:12px;opacity:.6}
th[aria-sort] .th-sort{color:var(--ink)}
th[aria-sort] .th-sort svg{opacity:1}
.cell-main{font-weight:500;color:var(--ink)}
.cell-sub{font-size:12px;color:var(--ink-3)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;border-top:1px solid var(--line)}
.pages{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pg{min-width:30px;height:30px;padding:0 6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;display:grid;place-items:center;color:var(--ink-2)}
.pg svg{width:14px;height:14px}
.pg:hover{background:var(--surface-2)}
.pg[aria-current="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pg[disabled]{opacity:.4;cursor:not-allowed}
.pg-gap{padding:0 4px;color:var(--ink-3)}
.pg-size{display:flex;align-items:center;gap:8px}

/* ---------- states ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 24px;color:var(--ink-2)}
.empty-ic{width:44px;height:44px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;color:var(--ink-3)}
.empty-ic svg{width:20px;height:20px}
.empty h4{font-size:15px}
.empty p{max-width:48ch;font-size:13px}
.sk{height:12px;border-radius:4px;background:linear-gradient(90deg,var(--surface-3) 0%,var(--surface-2) 50%,var(--surface-3) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-2);line-height:1.5}
.note>svg{width:18px;height:18px;margin-top:1px;color:var(--ink-3)}
.note b{color:var(--ink);font-weight:600}
.note.info{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.note.info>svg{color:var(--accent-ink)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.note.warn>svg{color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.note.bad>svg{color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ink)}
.note.ok>svg{color:var(--ok)}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.progress{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sk,.spin{animation:none}.progress i,.switch input,.switch input::after{transition:none}}

/* ---------- lists ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}

/* ---------- бизнес-правила ---------- */
function reason(c, ch, freq) {
  const k = chKey(ch), con = c.consent[k];
  if (supOf(c, k)) return 'suppressed';
  if (con.status === 'withdrawn') return 'withdrawn';
  if (con.status !== 'granted') return 'no_consent';
  if (ch === 'tg_bot' && c.tg !== 'subscribed') return c.tg === 'blocked' ? 'bot_blocked' : 'not_subscribed';
  if (ch === 'tg_manual' && (c.tg === 'not_found' || c.tg === 'blocked')) return c.tg === 'blocked' ? 'bot_blocked' : 'tg_not_found';
  if (ch === 'wa' && c.wa === 'meta_optout') return 'meta_optout';
  if (ch === 'wa' && c.wa === 'undeliverable') return 'undeliverable';
  if (freq && c.last[k] && dayDiff(c.last[k], TODAY) < freq) return 'recent';
  return null;
}
function audience(ch, freq) {
  const ok = [], ex = {};
  for (const c of activeClients()) { const r = reason(c, ch, freq); if (r) (ex[r] = ex[r] || []).push(c); else ok.push(c); }
  return {ok, ex, exN: Object.values(ex).reduce((a, b) => a + b.length, 0)};
}
function optOut(c, k, src, at) {

  const con = c.consent[k];
  if (con.status !== 'withdrawn') { con.status = 'withdrawn'; con.wAt = at.slice(0, 10); }
  S.events.push({at, cid: c.id, ch: k, type: 'withdrawn', src, ver: con.ver || '—', ev: '—'});
}

  const s = supOf(c, k), renewed = !!s || c.consent[k].status === 'withdrawn';
  if (s) { s.active = false; s.liftedAt = o.at; }
  c.consent[k] = {status: 'granted', at: o.at.slice(0, 10), wAt: null, src: o.src, ver: o.ver, ev: o.ev};
  S.events.push({at: o.at, cid: c.id, ch: k, type: renewed ? 'renewed' : 'granted', src: o.src, ver: o.ver, ev: o.ev});
}
function nums(cp) {
  const n = {planned: 0, sent: 0, delivered: 0, read: 0, failed: 0, skipped: 0, unknown: 0, pending: 0, notFound: 0, refused: 0};
  if (cp.rcp) {

    for (const r of cp.rcp) {
      if (r.st === 'accepted' || r.st === 'sent') n.sent++;
      else if (r.st === 'delivered') { n.sent++; n.delivered++; }
      else if (r.st === 'read') { n.sent++; n.delivered++; n.read++; }
      else if (r.st === 'unknown') { n.sent++; n.unknown++; }

}

/* ---------- таблица: сортировка, страницы, выбор ---------- */
const TS = {};
function tstate(id, o = {}) { return TS[id] || (TS[id] = {sort: o.sort || null, dir: o.dir || 1, page: 1, size: o.size || 10, sel: new Set(), pageIds: []}); }
function dtable(id, cols, rows, o = {}) {
  const st = tstate(id, o);
  let data = rows;
  if (st.sort) {
    const c = cols.find(x => x.k === st.sort);
    if (c) { const f = c.sv || (r => r[c.k]); data = rows.slice().sort((a, b) => { const x = f(a), y = f(b); return (x == null ? 1 : y == null ? -1 : x < y ? -1 : x > y ? 1 : 0) * st.dir; }); }
  }
  const total = data.length, pages = Math.max(1, Math.ceil(total / st.size));
  if (st.page > pages) st.page = pages;
  const from = (st.page - 1) * st.size, slice = data.slice(from, from + st.size);
  st.pageIds = slice.map(r => String(r.id));
  const selectable = !!o.select, span = cols.length + (selectable ? 1 : 0);
  const allSel = slice.length > 0 && slice.every(r => st.sel.has(String(r.id)));
  const head = (selectable ? `<th class="chk"><input type="checkbox" aria-label="Выбрать все на странице" data-chg="sel-page" data-t="${id}"${allSel ? ' checked' : ''}></th>` : '') +
    cols.map(c => {
      const sortable = c.sort !== false, cur = st.sort === c.k;
      const inner = sortable ? `<button type="button" class="th-sort" data-act="t-sort" data-t="${id}" data-k="${c.k}">${esc(c.l)}${ic(cur ? (st.dir > 0 ? 'up' : 'down') : 'sort')}</button>` : esc(c.l);
      return `<th class="${c.cls || ''}"${cur ? ` aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${inner}</th>`;
    }).join('');
  const body = slice.length ? slice.map(r => {
    const rid = String(r.id), on = selectable && st.sel.has(rid);
    const act = o.rowAct ? ` data-act="${o.rowAct}" data-id="${esc(rid)}" tabindex="0"` : '';
    return `<tr class="${o.rowAct ? 'clickable' : ''}${on ? ' sel' : ''}"${act}>${selectable ? `<td class="chk"><input type="checkbox" aria-label="Выбрать строку" data-chg="sel-row" data-t="${id}" data-id="${esc(rid)}"${on ? ' checked' : ''}></td>` : ''}${cols.map(c => `<td class="${c.cls || ''}">${c.r ? c.r(r) : esc(r[c.k])}</td>`).join('')}</tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="${span}" class="empty-cell">${o.empty || emptyState('search', 'Ничего не найдено', 'Измените условия поиска или сбросьте фильтры.')}</td></tr>`;
  const pager = (total > 10 || o.pager) ? pagerHtml(id, st, total, pages, from, slice.length) : '';
  return `<div class="tw"${o.h ? ` style="--tw-h:${o.h}px"` : ''}><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${pager}`;
}
function pageList(p, n) {
  if (n <= 7) return Array.from({length: n}, (_, i) => i + 1);
  const a = [1];
  if (p > 3) a.push('…');
  for (let i = Math.max(2, p - 1); i <= Math.min(n - 1, p + 1); i++) a.push(i);
  if (p < n - 2) a.push('…');
  a.push(n);
  return a;
}
function pagerHtml(id, st, total, pages, from, n) {
  const nums = pageList(st.page, pages).map(p => p === '…' ? '<span class="pg-gap">…</span>' : `<button type="button" class="pg" data-act="t-page" data-t="${id}" data-p="${p}"${p === st.page ? ' aria-current="true"' : ''}>${p}</button>`).join('');
  return `<div class="pager"><span class="num">${total ? `${from + 1}–${from + n} из ${fmtN(total)}` : 'Нет записей'}</span>
    <div class="pages"><button type="button" class="pg" data-act="t-page" data-t="${id}" data-p="${st.page - 1}"${st.page <= 1 ? ' disabled' : ''} aria-label="Предыдущая страница">${ic('left')}</button>${nums}<button type="button" class="pg" data-act="t-page" data-t="${id}" data-p="${st.page + 1}"${st.page >= pages ? ' disabled' : ''} aria-label="Следующая страница">${ic('right')}</button></div>
    <label class="pg-size">Строк на странице <select class="select sm" data-chg="t-size" data-t="${id}">${[10, 25, 50].map(s => `<option${s === st.size ? ' selected' : ''}>${s}</option>`).join('')}</select></label></div>`;
}

function filteredClients() {
  const f = S.f, q = f.q.trim().toLowerCase(), qd = q.replace(/\D/g, '');
  return activeClients().filter(c => {
    if (q && !(c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || (qd.length >= 3 && c.phone.includes(qd)))) return false;
    const wOk = c.consent.wa.status === 'granted' && !supOf(c, 'wa'), tOk = c.consent.tg.status === 'granted' && !supOf(c, 'tg');
    if (f.cons === 'wa' && !wOk) return false;
    if (f.cons === 'tg' && !tOk) return false;
    if (f.cons === 'none' && (c.consent.wa.status === 'granted' || c.consent.tg.status === 'granted')) return false;
    if (f.cons === 'withdrawn' && !(c.consent.wa.status === 'withdrawn' || c.consent.tg.status === 'withdrawn')) return false;
    if (f.tg !== 'all' && c.tg !== f.tg) return false;
    if (f.wa !== 'all' && c.wa !== f.wa) return false;
    const sp = supOf(c, 'wa') || supOf(c, 'tg');
    if (f.sup === 'yes' && !sp) return false;
    if (f.sup === 'no' && sp) return false;
    return true;
  });
}

function dlgGrant(id, k) {

function applyImport() {
  const I = impState(), at = nowIso(), file = DEMO.name;
  let added = 0, updated = 0, kept = 0;
  for (const r of I.val) {
    if (r.st === 'new') {
      const id = S.clients.length + 1, date = dots2iso(r.r[I.map.date]) || TODAY, ord = I.map.evidence ? r.r[I.map.evidence] : '';
      const c = {id, code: 'K-' + pad(id, 4), name: r.name || 'Без имени', phone: r.e164, file, row: r.rowNo, added: TODAY, orders: 1,
        lastOrder: dots2iso(r.r['Дата заказа']) || TODAY, orderNo: ord || '—', consent: {}, tg: 'none', wa: 'unknown', last: {wa: null, tg: null}, deleted: false};
      for (const k of ['wa', 'tg']) {
        const s = r.cons[k];
        if (s === 'granted') {
          c.consent[k] = {status: 'granted', at: date, wAt: null, src: 'Импорт Excel', ver: I.ver, ev: `${file}, строка ${r.rowNo}${ord ? ', заказ ' + ord : ''}`};
          S.events.push({at, cid: id, ch: k, type: 'granted', src: 'Импорт Excel', ver: I.ver, ev: c.consent[k].ev});
        } else if (s === 'withdrawn') {
          c.consent[k] = {status: 'withdrawn', at: null, wAt: TODAY, src: null, ver: null, ev: null};
          S.events.push({at, cid: id, ch: k, type: 'withdrawn', src: 'Импорт Excel: отметка «нет»', ver: '—', ev: `${file}, строка ${r.rowNo}`});
        } else c.consent[k] = {status: 'unknown', at: null, wAt: null, src: null, ver: null, ev: null};
      }
      S.clients.push(c); added++;
      if (r.delMatch) for (const k of ['wa', 'tg']) optOut(c, k, 'Запрет после удаления данных (совпал хэш номера)', at);
    } else if (r.st === 'update') {
      const c = r.ex;
      for (const k of ['wa', 'tg']) {
        if (r.cons[k] === 'granted') {
          if (refusedOn(c, k)) kept++;
          else if (c.consent[k].status !== 'granted') {
            c.consent[k] = {status: 'granted', at: dots2iso(r.r[I.map.date]) || TODAY, wAt: null, src: 'Импорт Excel', ver: I.ver, ev: `${file}, строка ${r.rowNo}`};
            S.events.push({at, cid: c.id, ch: k, type: 'granted', src: 'Импорт Excel', ver: I.ver, ev: c.consent[k].ev});
          }
        } else if (r.cons[k] === 'withdrawn' && c.consent[k].status === 'granted') {
          c.consent[k].status = 'withdrawn'; c.consent[k].wAt = TODAY;
          S.events.push({at, cid: c.id, ch: k, type: 'withdrawn', src: 'Импорт Excel: отметка «нет»', ver: c.consent[k].ver, ev: `${file}, строка ${r.rowNo}`});
        }
      }
      updated++;
    }
  }
  const errors = I.val.filter(r => ['dup', 'empty', 'invalid'].includes(r.st));
  I.res = {at, file, added, updated, skipped: errors.length, kept, errors};
  S.imports.unshift({file, at, rows: I.val.length, added, updated, skipped: errors.length, kept});
  audit(`Импорт ${file}: +${added}, обновлено ${updated}`);
}

async function pcCheck() {
  const P = S.pc;
  if (!(CHECKER && CHECKER.token) || P.busy) return;
  if (!P.phone.trim()) { P.err = 'Введите номер телефона.'; render(); return; }
  // Вкладку для WhatsApp открываем прямо в момент щелчка: после ответа сервера браузер заблокирует её как всплывающее окно
  let waTab = null;
  if (P.autoWa) {
    try {
      waTab = window.open('', '_blank');
      if (waTab) { waTab.opener = null; waTab.document.title = 'WhatsApp'; waTab.document.body.textContent = 'Открываем чат в WhatsApp Web…'; }
    } catch (e) { waTab = null; }
  }
  const closeTab = () => { try { if (waTab) waTab.close(); } catch (e) { /* вкладку уже закрыли */ } };
  P.busy = true; P.err = ''; P.res = null; render();  // старый результат убираем, чтобы не перепутать номера
  try {
    const resp = await fetch('/api/check', {method: 'POST', headers: pcHeaders(), body: JSON.stringify({phone: P.phone})});
    const j = await resp.json().catch(() => ({}));
    if (j.limit) P.limit = j.limit;
    if (!resp.ok) {
      closeTab();
      if (resp.status === 403) forgetChecker();  // проверщик перезапущен — нужен новый вход по ссылке
      P.err = j.error || `Проверщик ответил ошибкой ${resp.status}.`;
    } else {
      P.res = Object.assign({}, j, {wa: null, n: ++P.seq});
      P.hist.unshift({id: P.seq, at: j.checked_at, masked: j.masked, tg: j.telegram.status, wa: null});
      const st = j.telegram.status;
      P.tg = ['not_logged_in', 'banned', 'no_keys', 'offline'].includes(st) ? st : ['found', 'not_found', 'flood'].includes(st) ? 'ready' : P.tg;
      // Результат уже сохранён; вкладку WhatsApp открываем отдельно — её могли закрыть, пока шла проверка
      const link = waWebLink(j);
      if (waTab) {
        if (!link) closeTab();
        else if (!waTab.closed) { try { waTab.location.href = link; } catch (e) { /* вкладку закрыли или заняли */ } }
      }
    }
  } catch (e) {
    closeTab();
    P.err = 'Проверщик не отвечает. Проверьте, что окно с ним открыто, и откройте ссылку из него заново.';
  }
  P.busy = false; render();
}

  else if (today >= limit) main = `<div class="card">${emptyState('clock', 'Дневной лимит исчерпан', `Сегодня отправлено ${today} из ${limit}. Продолжите завтра, чтобы аккаунт не попал под ограничения Telegram за спам.`, `<button type="button" class="btn" data-act="go" data-r="settings">${ic('gear')}Изменить лимит</button>`)}</div>`;
  else {

      <div class="card-b stack">
        <div class="row"><span class="avatar lg">${esc(initials(c.name))}</span><div class="grow"><div class="cell-main" style="font-size:15px">${esc(c.name)}</div><div class="cell-sub"><span class="mono">${phone(c.phone, c.id)}</span>${S.showPhones ? '' : ` · <button type="button" class="link" data-act="cl-reveal" data-id="${c.id}">${shown ? 'скрыть номер' : 'показать номер'}</button>`}</div></div>${bArr(TG[c.tg])}</div>
        ${bubble(m, 'Текст для отправки')}
        <div class="row"><button type="button" class="btn btn-primary" data-act="man-chat" data-id="${c.id}">${ic('ext')}Открыть чат в Telegram</button><button type="button" class="btn" data-act="copy" data-text="${esc(msgText(m))}">${ic('copy')}Скопировать текст</button></div>
        <div class="stack-sm"><span class="label">Что получилось?</span><div class="row">
          <button type="button" class="btn" data-act="man-res" data-key="${esc(cur.key)}" data-v="sent">${ic('check')}Отправил</button><button type="button" class="btn" data-act="man-res" data-key="${esc(cur.key)}" data-v="not_found">${ic('search')}Нет в Telegram</button>
          <button type="button" class="btn" data-act="man-res" data-key="${esc(cur.key)}" data-v="refused">${ic('ban')}Клиент отказался</button><button type="button" class="btn btn-ghost" data-act="man-res" data-key="${esc(cur.key)}" data-v="later">${ic('clock')}Отложить</button></div></div>

  return backToList() + `<div class="card"><div class="card-h"><div><h3>${esc(cp.name)}</h3><div class="sub">${cp.id} · Telegram · вручную с аккаунта оператора · старт ${fdt(cp.sentAt)}</div></div>${bArr(CST[cp.status])}</div></div>

      <div class="stack">
        <div class="card"><div class="card-b stack-sm"><div class="row"><b>Прогресс</b><span class="right num muted">${fmtN(total - left)} из ${fmtN(total)}</span></div><div class="progress"><i style="width:${pct(total - left, total)}%"></i></div></div>
          <div class="list" style="border-top:1px solid var(--line)">${stat('Отправлено', n.sent)}${stat('Нет в Telegram', n.notFound)}${stat('Отказались', n.refused)}${stat('Пропущено проверкой', n.skipped)}${stat('Осталось', left)}</div>

}
function funnelRow(cp, max) {
  const n = nums(cp), lbl = cp.ch === 'tg_manual' ? 'отправлено вручную — статусов нет' : 'Telegram не сообщает о доставке';
  const b = (v, col, lab, tip, txt) => `<div class="fn-bar" data-tip="${esc(tip)}"><span class="fn-track"><i style="width:${max ? v * 100 / max : 0}%;background:var(${col})"></i></span><span class="fn-val">${txt}</span></div>`;
  const bars = b(n.sent, '--viz-1', 'Отправлено', `${cp.name}\nОтправлено: ${fmtN(n.sent)} из ${fmtN(n.planned)}`, fmtN(n.sent)) +
    (n.delivered == null ? `<div class="fn-na">Доставка и прочтение: ${lbl}</div>` :
      b(n.delivered, '--viz-2', 'Доставлено', `${cp.name}\nДоставлено: ${fmtN(n.delivered)} · ${pct(n.delivered, n.sent)}% от отправленных`, '') +
      b(n.read, '--viz-3', 'Прочитано', `${cp.name}\nПрочитано: ${fmtN(n.read)} · ${pct(n.read, n.sent)}% от отправленных`, `${fmtN(n.read)} прочитали · ${pct(n.read, n.sent)}%`));
  return `<div class="fn-row"><div class="fn-name">${esc(cp.name)}<small>${CH_LABEL[cp.ch]} · ${fd(cp.sentAt)}</small></div><div class="fn-bars">${bars}</div></div>`;
}
const funnelLegend = () => `<div class="legend"><span><i style="background:var(--viz-1)"></i>Отправлено</span><span><i style="background:var(--viz-2)"></i>Доставлено</span><span><i style="background:var(--viz-3)"></i>Прочитано</span></div>`;
function errGroups(list) {
  const g = {};
  for (const cp of list) for (const r of (cp.rcp || [])) if (r.st === 'failed' && r.err) { const code = r.err.split(' · ')[0]; g[code] = (g[code] || 0) + 1; }
  return Object.entries(g).map(([code, n]) => Object.assign({id: code, code, n}, ERR[code] || {ch: '—', d: code, act: '—'}));
}
function vReport(cp) {
  if (cp.status === 'cancelled') return backToList() + `<div class="card"><div class="card-h"><div><h3>${esc(cp.name)}</h3><div class="sub">${cp.id} · ${CH_LABEL[cp.ch]} · создана ${fd(cp.created)}</div></div>${bArr(CST.cancelled)}</div>${emptyState('ban', 'Кампания отменена', 'Сообщения по ней не отправлялись. Отменённую кампанию нельзя запустить снова — создайте новую.', `<button type="button" class="btn btn-primary btn-sm" data-act="camp-new">${ic('plus')}Новая кампания</button>`)}</div>`;
  const n = nums(cp), f = S.ui.repFilter, isWa = cp.ch === 'wa';
  const rows = cp.rcp.map(r => Object.assign({id: r.key}, r)).filter(r => f === 'all' || (f === 'ok' ? ['accepted', 'delivered', 'read', 'sent'].includes(r.st) : ['failed', 'skipped', 'not_found', 'refused', 'unknown'].includes(r.st)));
  const errs = errGroups([cp]), m = renderMsg(cp, null);
  return backToList() + `<div class="card"><div class="card-h"><div><h3>${esc(cp.name)}</h3><div class="sub">${cp.id} · ${CH_LABEL[cp.ch]} · отправка ${fdt(cp.sentAt)}${cp.doneAt ? ' · завершена ' + fdt(cp.doneAt) : ''}</div></div>${bArr(CST[cp.status])}</div>
      <div class="card-b"><div class="grid g-5">
        ${kpi('Получателей', fmtN(n.planned), '', '', 'flat')}${kpi(cp.ch === 'tg_manual' ? 'Отправлено вручную' : 'Принято API', fmtN(n.sent), `${pct(n.sent, n.planned)}% от получателей`, '', 'flat')}
        ${kpi('Доставлено', n.delivered == null ? 'нет данных' : fmtN(n.delivered), n.delivered == null ? 'Telegram не сообщает' : `${pct(n.delivered, n.sent)}% от отправленных`, '', 'flat')}

        ${kpi('Ошибки и пропуски', fmtN(n.failed + n.skipped + n.notFound + n.refused), `ошибки ${n.failed} · пропуски ${n.skipped + n.notFound} · отказы ${n.refused}`, '', 'flat')}</div></div></div>
    <div class="grid g-main">

    ${cp.excluded && Object.keys(cp.excluded).length ? `<div class="card"><div class="card-h"><div><h3>Исключены при запуске</h3><div class="sub">Эти клиенты не попали в кампанию</div></div></div><div class="list">${Object.entries(cp.excluded).map(([k, v]) => `<div class="li"><div class="grow li-t">${REASON[k]}</div><span class="num">${v}</span></div>`).join('')}</div></div>` : ''}
    <div class="card"><div class="toolbar"><b>Получатели</b>${seg('rep-filter', f, [['all', 'Все'], ['ok', 'Успешно'], ['problem', 'Ошибки и пропуски']])}</div>
      ${dtable('rep-rcp', [
        {k: 'key', l: 'Ключ отправки', r: r => `<span class="mono">${r.key}</span>`},
        {k: 'name', l: 'Клиент', sv: r => cl(r.cid).name, r: r => (cl(r.cid).deleted ? '<span class="muted">Данные удалены</span>' : esc(cl(r.cid).name))},
        {k: 'phone', l: 'Телефон', sort: false, r: r => (cl(r.cid).deleted ? '—' : `<span class="mono">${phone(cl(r.cid).phone, r.cid)}</span>`)},
        {k: 'st', l: 'Статус', r: r => bArr(RST[r.st])},
        {k: 'at', l: 'Время', r: r => `<span class="num">${fdt(r.at)}</span>`},
        {k: 'err', l: 'Ошибка или причина', cls: 'wrap', r: r => `<span class="li-s">${esc(r.err || '')}</span>`},
      ], rows, {size: 10, pager: true, h: 520})}</div>`;
}

/* =========================================================
   АНАЛИТИКА
   ========================================================= */
function niceMax(v) { v = Math.max(2, v); const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 4, 6, 8, 10]) if (m * p >= v && (m * p) % 2 === 0) return m * p; return 10 * p; }
function vAnalytics() {
  const P = S.an.period, from = addDays(TODAY, -(P - 1)), chf = S.an.ch;
  const inCh = cp => chf === 'all' || (chf === 'wa' ? cp.ch === 'wa' : cp.ch !== 'wa');
  const camps = S.campaigns.filter(cp => cp.rcp && inCh(cp));
  const list = camps.filter(cp => cp.sentAt && cp.sentAt.slice(0, 10) >= from).sort((a, b) => b.sentAt.localeCompare(a.sentAt));
  const T = {sent: 0, failed: 0, skipped: 0, waSent: 0, del: 0, read: 0};
  list.forEach(cp => { const n = nums(cp); T.sent += n.sent; T.failed += n.failed; T.skipped += n.skipped + n.notFound; if (cp.ch === 'wa') { T.waSent += n.sent; T.del += n.delivered; T.read += n.read; } });
  const outs = S.events.filter(e => e.type === 'withdrawn' && e.at.slice(0, 10) >= from && (chf === 'all' || e.ch === (chf === 'wa' ? 'wa' : 'tg'))).length;
  const days = Array.from({length: P}, (_, i) => addDays(from, i)), per = {};
  camps.forEach(cp => cp.rcp.forEach(r => { if (r.at && ['accepted', 'delivered', 'read', 'sent', 'unknown'].includes(r.st)) { const d = r.at.slice(0, 10); per[d] = (per[d] || 0) + 1; } }));
  const vals = days.map(d => per[d] || 0), mx = niceMax(Math.max(...vals));
  const maxPlanned = Math.max(1, ...list.map(cp => nums(cp).planned));
  const errs = errGroups(list);
  const funnel = !list.length ? emptyState('chart', 'Нет кампаний за период', 'Выберите период длиннее или другой канал.')
    : S.an.view === 'table' ? dtable('an-tbl', [
      {k: 'name', l: 'Кампания', r: c => `<div class="cell-main">${esc(c.name)}</div><div class="cell-sub mono">${c.id}</div>`},
      {k: 'ch', l: 'Канал', r: c => CH_LABEL[c.ch]}, {k: 'sentAt', l: 'Дата', r: c => `<span class="num">${fd(c.sentAt)}</span>`},
      ...['planned', 'sent', 'delivered', 'read', 'failed'].map((k, i) => ({k, l: ['Получателей', 'Отправлено', 'Доставлено', 'Прочитано', 'Ошибки'][i], cls: 'r', sv: c => nums(c)[k], r: c => { const v = nums(c)[k]; return v == null ? '<span class="muted">нет данных</span>' : `<span class="num">${fmtN(v)}</span>`; }})),
    ], list, {size: 10})
    : `<div class="card-b fn">${list.map(cp => funnelRow(cp, maxPlanned)).join('')}</div>`;
  const ticks = [mx, mx / 2, 0];
  const chart = `<div class="card-b"><div class="cc" role="img" aria-label="Отправлено сообщений по дням">${ticks.map(t => `<div class="cc-grid" style="top:${(1 - t / mx) * 100}%${t === 0 ? ';border-top-color:transparent' : ''}"><span>${fmtN(t)}</span></div>`).join('')}

// Код приглашения в бота. В рабочей версии — случайные 128 бит, одноразовый, хранится на сервере и связан с клиентом
const inviteToken = c => hashOf('invite:' + c.code + ':a') + hashOf('invite:' + c.code + ':b');
// В прототипе — простой хэш. В рабочей версии — HMAC-SHA256 с секретным ключом из .env, иначе номер можно подобрать перебором
function hashOf(s) { let h = 0x811c9dc5; for (const ch of String(s)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
function deleteClient(c) {
  c.hash = hashOf(c.phone);
  for (const k of ['wa', 'tg']) if (!supOf(c, k)) S.sup.push({id: 'S-' + pad(++S.seq.sup, 4), cid: c.id, ch: k, at: nowIso(), src: 'Удаление данных по запросу клиента', active: true});
  c.deleted = true; c.name = 'Данные удалены'; c.phone = null; c.orderNo = '—'; c.file = '—'; c.row = null; c.orders = 0; c.lastOrder = null;
  // Остаются только факты для учёта: канал, тип события и дата. Ссылки на строку файла и номер заказа стираются
  for (const k of ['wa', 'tg']) { c.consent[k].ev = null; }
  S.events.forEach(e => { if (e.cid === c.id) e.ev = '—'; });
  S.reveal.delete(c.id);
  if (TS.clients) TS.clients.sel.delete(String(c.id));
  audit(`Удалены данные клиента ${c.code}`);
}

function focusSig(el) {
  if (!el || el === document.body || !el.closest) return null;
  if (el.id) return '#' + CSS.escape(el.id);
  const d = el.dataset;
  if (!d || !(d.act || d.chg || d.in)) return null;
  let s = el.tagName.toLowerCase();
  for (const k of ['act', 'chg', 'in', 'id', 'v', 'r', 'k', 'p', 't', 's', 'w']) if (d[k] != null) s += `[data-${k}="${CSS.escape(d[k])}"]`;
  return s;
}
function render() {
  const a = document.activeElement, inMain = a && a.closest && a.closest('#view, #nav, #nav-foot, #top');
  const sig = inMain ? focusSig(a) : null;
  let ss = null, se = null;
  try { ss = a.selectionStart; se = a.selectionEnd; } catch (e) { /* не текстовое поле */ }
  renderNav(); renderTop();
  $('#view').innerHTML = S.loading === S.route ? vSkeleton() : ROUTES[S.route].v();
  if (sig) {
    const el = document.querySelector(sig);
    if (el && el !== document.activeElement && !el.disabled) {
      el.focus({preventScroll: true});
      if (ss != null && el.setSelectionRange) { try { el.setSelectionRange(ss, se); } catch (e) { /* поле без курсора */ } }
    }
  }
}
function closeNav() { $('#app').classList.remove('nav-open'); $('#scrim').hidden = true; }
function go(route, keepSub) {
  if (!ROUTES[route]) route = 'overview';
  if (S.route === 'campaigns' && S.draft && (S.ui.camp.mode === 'wizard' || S.ui.camp.mode === 'confirm') && !keepSub) {
    if (S.draft.name.trim()) { saveDraft(); toast('Черновик сохранён', 'ok', S.draft.name.trim()); }
    S.draft = null;
  }
  if (route === 'campaigns' && !keepSub) S.ui.camp = {mode: 'list', id: null};
  S.route = route;
  closeNav(); closeDrawer();
  if (['clients', 'channels', 'analytics'].includes(route) && !S.loaded.has(route)) {
    S.loading = route;
    setTimeout(() => { S.loaded.add(route); if (S.loading === route) S.loading = null; render(); }, 420);
  }
  const m = $('#main');
  if (m) m.scrollTop = 0;
  if (location.hash.slice(1) !== route) { try { history.replaceState(null, '', '#' + route); } catch (e) { location.hash = route; } }
  render();
}
function openCampaign(id) {
  const cp = campById(id);
  if (!cp) return;
  if (cp.status === 'draft') { S.draft = draftFrom(cp); S.ui.camp = {mode: 'wizard', id: cp.id}; }
  else if (cp.status === 'manual') { S.ui.camp = {mode: 'manual', id}; nextManual(cp); }
  else if (cp.status === 'sending' || cp.status === 'paused') S.ui.camp = {mode: 'send', id};
  else S.ui.camp = {mode: 'report', id};
  S.ui.repFilter = 'all';
  ['rep-rcp', 'man-q'].forEach(k => { delete TS[k]; });
  go('campaigns', true);
}

/* ---------- события ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') return;
  if (t.tagName === 'TR' && e.target.closest('input, button, a, label, select')) return;
  const fn = A[t.dataset.act];
  if (fn) fn(t.dataset, t, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#modal-root').innerHTML) closeModal(); else if ($('#drawer-root').innerHTML) closeDrawer(); else closeNav(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.id === 'kw-new') { e.preventDefault(); A['kw-add'](); }
  if (e.key === 'Enter' && e.target.id === 'pc-phone') { e.preventDefault(); pcCheck(); }
});
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.in; if (k && IN[k]) IN[k](e.target.value, e.target); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.chg; if (k && CH[k]) CH[k](e.target); });
document.addEventListener('dragover', e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.toggle('over', !!e.target.closest('#drop')); });
document.addEventListener('dragleave', e => { const d = $('#drop'); if (d && !e.relatedTarget) d.classList.remove('over'); });
document.addEventListener('drop', e => {
  e.preventDefault();
  const d = $('#drop');
  if (d) d.classList.remove('over');
  if (e.target.closest && e.target.closest('#drop')) { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) toast('Прототип не читает настоящие файлы', 'warn', `«${f.name}» не открыт и никуда не передан. Нажмите «Взять демо-файл».`); }
});
const tipEl = () => $('#tip');
function posTip(e) { const tip = tipEl(), w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 12; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 8) y = e.clientY + 18; tip.style.left = Math.max(8, x) + 'px'; tip.style.top = y + 'px'; }
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('[data-tip]'), tip = tipEl(); if (!t) { tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; posTip(e); });
document.addEventListener('mousemove', e => { if (!tipEl().hidden) posTip(e); });
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (ROUTES[r] && r !== S.route) go(r); });

/* ---------- запуск ---------- */
try { const t = localStorage.getItem('mcrm-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) { /* хранилище недоступно */ }
try { const w = localStorage.getItem('meridian-autowa'); if (w === '0' || w === '1') S.pc.autoWa = w === '1'; } catch (e) { /* хранилище недоступно */ }
seed();
const h0 = location.hash.slice(1);
S.route = ROUTES[h0] ? h0 : 'overview';
S.loaded.add(S.route);
render();
})();
</script>
